name: Deploy OHC website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = [s.strip() for s in re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S) if s.strip()]
          if len(scripts) != 1:
              raise SystemExit('Expected exactly one inline JavaScript block')
          Path('/tmp/ohc-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/ohc-inline.js
          node --check calendar.js
          node --check share.js
      - name: Test eerste-ronde-lotingswissels
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
