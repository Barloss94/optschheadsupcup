<header class="top"><div class="container topinner"><a class="identity" href="#overzicht" aria-label="Naar overzicht"><div class="mark">♠</div><div><b>OPTSCH HEADS-UP CUP</b><span>ÉÉN TEGEN ÉÉN. ÉÉN KAMPIOEN.</span></div></a><nav id="nav" class="nav" aria-label="Hoofdnavigatie"></nav></div></header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.0"></script>
<script>
'use strict';
const STORAGE='ohc.online.v1';

const PROJECT_URL='https://lnlaqrljtwrxtfsyotnn.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_wXilWOoEC4fEBswRNtnWAw_MRQ0AooI';
let sb=null,authUser=null,isAdmin=false,eventId=null,currentVersion=1;
let publicState=null,loading=true,loadError=null,mutationToken=0,saveQueue=Promise.resolve();
async function fetchPublic(){
 const response=await sb.from('ohc_public_events').select('event_id,state').eq('slug','2026').single();
 if(response.error)throw new Error('Publieke toernooidata ophalen: '+response.error.message);
 eventId=response.data.event_id;
 publicState=normalizeState(response.data.state);
 if(!isAdmin)data=structuredClone(publicState);
}
function normalizeState(v){
 return {...structuredClone(DEFAULT),...(v||{}),settings:{...structuredClone(DEFAULT.settings),...(v?.settings||{}),roundDeadlines:v?.settings?.roundDeadlines||{},resultText:v?.settings?.resultText||{}}};
}
async function fetchPrivate(){
 if(!authUser||!eventId){isAdmin=false;data=structuredClone(publicState);return}
 const response=await sb.from('ohc_events').select('id,state,version').eq('id',eventId).maybeSingle();
 if(response.error||!response.data){
   isAdmin=false;
   data=structuredClone(publicState);
   return;
 }
 isAdmin=true;
 currentVersion=Number(response.data.version);
 data=normalizeState(response.data.state);
}
async function initialize(){
 loading=true;loadError=null;render();
 try{
   if(!window.supabase?.createClient)throw new Error('De Supabase-client is niet geladen. Controleer de internetverbinding.');
   if(!sb)sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
   await fetchPublic();
   const {data:sessionData,error:sessionError}=await sb.auth.getSession();
   if(sessionError)throw sessionError;
   authUser=sessionData.session?.user||null;
   if(authUser)await fetchPrivate();
   if(!window.ohcAuthListener){
     const {data:listener}=sb.auth.onAuthStateChange((event,session)=>{
       authUser=session?.user||null;
       if(event==='SIGNED_OUT'){isAdmin=false;data=structuredClone(publicState);render()}
       else if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED')setTimeout(async()=>{await fetchPrivate();render()},0);
     });
     window.ohcAuthListener=listener;
   }
   if(!window.ohcRealtime){
     window.ohcRealtime=sb.channel('ohc-public-updates')
       .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ohc_public_events'},
         async payload=>{
           if(payload.new?.event_id!==eventId)return;
           publicState=normalizeState(payload.new.state);
           if(!isAdmin){data=structuredClone(publicState);render()}
         }).subscribe();
   }
 }catch(e){loadError=String(e?.message||e)}
 loading=false;render();
}
async function login(){
 const email=$('loginEmail')?.value?.trim(),password=$('loginPassword')?.value;
 if(!email||!password){notify('Vul je e-mailadres en wachtwoord in.');return}
 const r=await sb.auth.signInWithPassword({email,password});
 if(r.error){notify('Inloggen mislukt: '+r.error.message);return}
 authUser=r.data.user;
 await fetchPrivate();render();
 if(!isAdmin)notify('Dit account heeft geen Ranking-beheerrechten.');
}
async function logout(){
 const r=await sb.auth.signOut();
 if(r.error){notify('Uitloggen mislukt: '+r.error.message);return}
 authUser=null;isAdmin=false;data=structuredClone(publicState);tab='overzicht';location.hash='overzicht';render();
}

const SHORT_DAYS=['Zo','Ma','Di','Wo','Do','Vr','Za'];
const DAYS=[{id:1,name:'Maandag',search:'maandagen'},{id:2,name:'Dinsdag',search:'dinsdagen'},{id:3,name:'Woensdag',search:'woensdagen'},{id:4,name:'Donderdag',search:'donderdagen'},{id:5,name:'Vrijdag',search:'vrijdagen'},{id:6,name:'Zaterdag',search:'zaterdagen'},{id:0,name:'Zondag',search:'zondagen'}];
const DEFAULT={"players":[],"draw":[],"results":{},"schedule":{},"settings":{"title":"OPTSCH HEADS-UP CUP","format":"Directe knock-out","status":"Inschrijving open","roundDeadlines":{},"resultText":{}}};

const ROUND_WINDOWS=[
 {weeks:'49/50',start:'2026-11-30',end:'2026-12-13',exclusions:['2026-12-04','2026-12-05','2026-12-06'],label:'30 november t/m 13 december 2026'},
 {weeks:'51/52',start:'2026-12-14',end:'2026-12-27',exclusions:['2026-12-24','2026-12-25','2026-12-26'],label:'14 t/m 27 december 2026'},
 {weeks:'1/2',start:'2027-01-04',end:'2027-01-17',exclusions:[],label:'4 t/m 17 januari 2027'},
 {weeks:'2/3',start:'2027-01-11',end:'2027-01-24',exclusions:[],label:'11 t/m 24 januari 2027'},
 {weeks:'3/4',start:'2027-01-18',end:'2027-01-31',exclusions:[],label:'18 t/m 31 januari 2027'}
];
function ensureRoundSettings(){
 data.settings.roundDeadlines=Object.fromEntries(ROUND_WINDOWS.map((w,r)=>[r,w.end]));
 data.settings.roundWindows=ROUND_WINDOWS;
}
function roundDays(r){
 const w=ROUND_WINDOWS[r];if(!w)return[];
 const days=[];const date=new Date(w.start+'T12:00:00');
 while(toLocalISO(date)<=w.end){const day=toLocalISO(date);if(!w.exclusions.includes(day))days.push(day);date.setDate(date.getDate()+1)}
 return days;
}
function periodInfo(r){
 const w=ROUND_WINDOWS[r];if(!w)return'Niet ingedeeld';
 return 'Week '+w.weeks+' · '+w.label;
}
function blockedInfo(r){
 const w=ROUND_WINDOWS[r];return w.exclusions.length?'Niet spelen: '+w.exclusions.map(d=>prettyDate(d)).join(', '):'Geen uitgesloten datums';
}
function roundCalendar(){
 return '<section class="panel">'+heading('Vaste speelperiodes','<span class="pill ok">Vastgesteld</span>')+
 '<p class="muted smalltext">Alle duels worden over de toegestane dagen binnen hun eigen ronde verspreid. De periodes van ronde 3, 4 en 5 overlappen; een vervolgronde kan pas plaatsvinden na de beslissende voorgaande duels.</p>'+
 '<div class="roundperiods">'+ROUND_WINDOWS.map((w,i)=>'<div class="periodrow"><div><strong>Ronde '+(i+1)+'</strong><span class="tag"> WEEK '+w.weeks+'</span></div><div><div class="smalltext">'+esc(w.label)+'</div><div class="muted smalltext">'+esc(blockedInfo(i))+'</div></div></div>').join('')+'</div></section>';
}
function dateDifference(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000)}
function parentLatestDate(r,index,planned){
 if(r===0)return'';
 const prev=bracket()[r-1]||[];
 const dates=[prev[index*2],prev[index*2+1]].map(m=>m&&planned[m.id]?.date).filter(Boolean);
 return dates.length?dates.sort().at(-1):'';
}
function possibleDate(m,date,planned){
 const w=ROUND_WINDOWS[m.round];if(!w||date<w.start||date>w.end||w.exclusions.includes(date))return false;
 const prior=parentLatestDate(m.round,m.index,planned);
 if(prior&&date<=prior)return false;
 if(m.a&&m.b&&!weekdayOptions(m.a,m.b).some(d=>d.id===new Date(date+'T12:00:00').getDay()))return false;
 if(m.a||m.b){
  for(const other of allMatches()){
   if(other.id===m.id||planned[other.id]?.date!==date)continue;
   if([m.a,m.b].filter(Boolean).some(id=>[other.a,other.b].includes(id)))return false;
  }
 }
 return true;
}
function autoPlanMatches(showNotice=true){
 const rounds=bracket();if(!rounds.length)return{total:0,assigned:0,missing:[]};
 const old=structuredClone(data.schedule);const next={};const missing=[];
 // First fix earlier-round fixtures, then place each dependent knockout fixture after its feeders.
 for(const [r,matches] of rounds.entries()){
  const fixtures=matches.filter(m=>!m.isBye&&!m.resolved || (!m.isBye&&m.a&&m.b));
  const days=roundDays(r);
  for(let i=0;i<fixtures.length;i++){
   const m=fixtures[i],existing=old[m.id],desired=days[Math.min(days.length-1,Math.floor((i+0.5)*days.length/fixtures.length))];
   const choices=days.filter(date=>possibleDate(m,date,next));
   if(!choices.length){missing.push(m.id);continue}
   const selected=existing?.date&&choices.includes(existing.date)?existing.date:
     choices.slice().sort((a,b)=>Math.abs(dateDifference(a,desired))-Math.abs(dateDifference(b,desired))||a.localeCompare(b))[0];
   const confirmed=existing?.date===selected&&existing.provisional===false;
   next[m.id]={date:selected,time:existing?.date===selected?(existing.time||''):'',provisional:!confirmed,auto:!confirmed};
  }
 }
 data.schedule=next;
 const result={total:rounds.flat().filter(m=>!m.isBye).length,assigned:Object.keys(next).length,missing};
 if(showNotice)notify(missing.length?result.assigned+' duels verdeeld. '+missing.length+' duels zonder geschikte datum: controleer verhinderingen.':result.assigned+' duels verdeeld over de vijf rondeperiodes. Nog te bevestigen in Beheer.');
 return result;
}

function bracket(){if(!data.draw.length)return[];const out=[];let current=[];for(let i=0;i<data.draw.length;i+=2){const a=data.draw[i],b=data.draw[i+1];const id=matchKey(0,i/2);const value=data.results[id];const winner=a&&b?([a,b].includes(value)?value:null):(a||b||null);current.push({id,round:0,index:i/2,a,b,winner,resolved:!(a&&b)||!!winner,isBye:!(a&&b)})}out.push(current);let r=1;while(current.length>1){const next=[];for(let i=0;i<current.length;i+=2){const left=current[i],right=current[i+1],a=left.winner,b=right.winner,id=matchKey(r,i/2);const ready=left.resolved&&right.resolved;const value=data.results[id];const winner=!ready?null:(a&&b?([a,b].includes(value)?value:null):(a||b||null));next.push({id,round:r,index:i/2,a,b,winner,resolved:ready&&(!(a&&b)||!!winner),isBye:ready&&!(a&&b),ready})}out.push(next);current=next;r++}return out}

function scheduleConflict(m,s){
 if(!s?.date)return'';
 if(!/^\d{4}-\d\d-\d\d$/.test(s.date)||Number.isNaN(+new Date(s.date+'T12:00:00')))return'Ongeldige datum.';
 const w=ROUND_WINDOWS[m.round],alerts=[];
 if(!w||s.date<w.start||s.date>w.end)alerts.push('De datum valt buiten de verplichte speelperiode van ronde '+(m.round+1)+'.');
 if(w?.exclusions.includes(s.date))alerts.push('Deze datum is uitgesloten van het speelschema.');
 if(m.a&&m.b&&!weekdayOptions(m.a,m.b).some(x=>x.id===new Date(s.date+'T12:00:00').getDay()))alerts.push('Beide spelers zijn niet gezamenlijk beschikbaar op deze dag.');
 const b=bracket();
 if(m.round>0){
  for(const feeder of [b[m.round-1]?.[m.index*2],b[m.round-1]?.[m.index*2+1]]){
   const d=feeder&&data.schedule[feeder.id]?.date;
   if(d&&s.date<=d)alerts.push('Het duel moet na de voorgaande ronde plaatsvinden.');
  }
 }
 const follow=b[m.round+1]?.[Math.floor(m.index/2)];
 if(follow&&data.schedule[follow.id]?.date&&s.date>=data.schedule[follow.id].date)alerts.push('Een vervolgronde staat op of vóór deze datum.');
 for(const other of allMatches()){
  if(other.id===m.id||!data.schedule[other.id]?.date||data.schedule[other.id].date!==s.date)continue;
  if([m.a,m.b].filter(Boolean).some(id=>[other.a,other.b].includes(id)))alerts.push('Een van de spelers heeft al een andere wedstrijd op deze dag.');
 }
 return [...new Set(alerts)].join(' ');
}

 (!m.a||!m.b?'<p class="hint">Voorlopige datum voor dit duel. Bevestigen kan zodra beide spelers bekend zijn.</p>':
 '<div class="chips">'+(opt.length?opt.slice(0,4).map(x=>'<button class="chip" onclick="pickDate('+r+','+m.index+',\''+x+'\')" type="button">'+esc(prettyDate(x))+'</button>').join(''):'<span class="chip busy">Geen geschikte gemeenschappelijke speeldag in deze ronde</span>')+'</div>'+
 '<div class="btnbar" style="margin-top:11px">'+button('Datum bevestigen','saveMatchDate('+r+','+m.index+')','alt',true)+(s.date?button('Planning opnieuw berekenen','replanMatch('+r+','+m.index+')','ghost',true):'')+'</div>'))+
 (s.date?'<p class="muted smalltext">'+(s.provisional?'Automatisch voorstel':'Datum bevestigd')+'</p>':'<p class="muted smalltext">Nog niet ingepland</p>')+
 (scheduleConflict(m,s)?'<div class="notice orange">'+esc(scheduleConflict(m,s))+'</div>':'')+
 '</div>';
 }).join('')+'</div>').join('')+'</section>';
}
function runAutoPlanning(){if(!isAdmin)return;const result=autoPlanMatches();save();render();if(result.missing.length)notify(result.assigned+' duels verdeeld; '+result.missing.length+' duels vereisen handmatige oplossing.')}
function replanMatch(r,i){if(!isAdmin)return;delete data.schedule[matchKey(r,i)];autoPlanMatches(false);save();render();notify('Voorstel opnieuw berekend binnen de rondeperiode.')}

function adminSettingsView(){
 return '<section class="panel">'+heading('Vaste speelperiodes en instellingen')+
 '<p class="smalltext muted">De speelperiodes zijn door de organisatie vastgesteld en kunnen niet per wedstrijd worden verruimd. Data daarbuiten en uitgesloten feestdagen worden geblokkeerd.</p>'+

 '<div class="formgrid"><div class="field"><label for="eventStatus">Toernooistatus</label><select id="eventStatus" onchange="updateStatus(this.value)">'+['Inschrijving open','Inschrijving gesloten','Loting uitgevoerd','Toernooi bezig','Toernooi afgerond'].map(x=>'<option '+(x===data.settings.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+
 '<div class="field"><label for="eventFormat">Toernooivorm (vastgelegd)</label><input id="eventFormat" value="Directe knock-out (maximaal 32 deelnemers)" disabled></div></div>'+
 '<hr class="divider"><h3>Export, back-up en herstellen</h3><div class="btnbar">'+button('Back-up (JSON)','exportJson()','alt',true)+button('Speelschema (CSV)','exportMatchesCsv()','ghost',true)+button('Toernooiboom (PNG)','exportBracketPng()','ghost',true)+button('Afdrukken / PDF','window.print()','ghost',true)+'</div>'+
 '<div class="field" style="max-width:420px;margin-top:16px"><label for="backupfile">Back-up terugzetten uit JSON</label><input id="backupfile" type="file" accept=".json,application/json" onchange="importBackup(event)"></div>'+
 '<div class="btnbar" style="margin-top:12px">'+button('Loting en uitslagen wissen','resetAll()','danger',true)+'</div>'+

}
function adminView(){if(!isAdmin)return '<section class="panel auth-panel"><h2>Beheer OHC</h2><p class="muted smalltext">Log in met het bestaande beheerdersaccount van OPTSCH Ranking. Alleen beheerders kunnen deelnemers, loting, planning en uitslagen wijzigen.</p><div class="field"><label for="loginEmail">E-mailadres</label><input id="loginEmail" type="email" autocomplete="username" placeholder="E-mailadres"></div><div class="field"><label for="loginPassword">Wachtwoord</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Wachtwoord" onkeydown="if(event.key===&#39;Enter&#39;)login()"></div><div class="btnbar"><button class="btn" onclick="login()">Inloggen</button>'+(authUser?'<button class="btn ghost" onclick="logout()">Uitloggen (geen beheerrechten)</button>':'')+'</div></section>';return '<div class="sectiontitle"><h2 style="font-size:27px">Organisatiebeheer</h2><div class="btnbar"><span class="pill ok">VERBONDEN MET RANKING</span><button type="button" class="btn ghost small" onclick="logout()">Uitloggen</button></div></div>'+adminPlayerView()+adminDrawView()+adminScheduleView()+adminSettingsView()}
function deadlineBadge(r){const w=ROUND_WINDOWS[r];return w?`<span class="pill blue">W${w.weeks} · ${esc(w.label)}</span>`:'<span class="pill warn">Geen periode vastgelegd</span>'}
function rulesView(){const total=data.players.length,byes=total>1?2**Math.ceil(Math.log2(total))-total:0;return `<section class="panel"><div class="sectiontitle"><h2>Toernooireglement</h2><span class="pill ok">Vastgestelde toernooivorm</span></div><div class="steps"><div class="step"><div class="stepnum">ARTIKEL 01</div><h3>Directe uitschakeling</h3><p>Een speler die een duel verliest, is uitgeschakeld. Een winnaar gaat door naar het volgende duel. Er is geen verliezersronde.</p></div><div class="step"><div class="stepnum">ARTIKEL 02</div><h3>Willekeurige loting</h3><p>Deelnemers worden zonder plaatsingslijst ingeloot. Zo nodig zijn er ${byes} vrijlotingen voor het huidige deelnemersaantal.</p></div><div class="step"><div class="stepnum">ARTIKEL 03</div><h3>Eén kampioen</h3><p>De twee overgebleven spelers spelen de finale. De finalewinnaar mag zich OHC-kampioen noemen.</p></div></div><hr class="divider"><h3>Hoe werkt de planning?</h3><p class="smalltext muted">Iedere ronde heeft een verplichte periode. Alle duels worden gelijkmatig over de toegestane data verdeeld. De planning houdt rekening met opgegeven verhinderingen en de volgorde van de knock-outduels. De uitgesloten decemberdatums zijn nooit toegestaan. Automatische voorstellen worden door de organisatie bevestigd.</p>${data.draw.length?`<div class="deadlinegrid">${Array.from({length:howManyRounds()},(_,i)=>`<div class="infoitem"><strong>${roundLabel(i,howManyRounds())}</strong>${deadlineBadge(i)}</div>`).join('')}</div>`:''}</section>${roundCalendar()}<section class="panel"><div class="sectiontitle"><h2>Nog vast te stellen</h2><span class="pill warn">Geen definitieve afspraken</span></div><p class="muted smalltext">Deze onderwerpen moeten door de organisatie worden besloten voordat de site als officieel reglement gebruikt kan worden.</p><div class="rulesgrid">${['Buy-in en eventuele kosten','Pokerplatform en speelvariant','Startstack en blindstructuur','Duur en eventuele onderbrekingen per duel','Omgaan met afzeggingen binnen de speelperiode','Regels bij niet verschijnen of technische problemen','Prijzenverdeling en eventuele trofeeën','Inschrijfdeadline en deelnamevoorwaarden'].map(x=>`<div class="rulepending"><span class="openbullet">○</span>${x}</div>`).join('')}</div></section>`}
function saveDeadlines(){notify('De vijf speelperiodes staan vast en kunnen niet worden gewijzigd.')}
function downloadFile(text,filename,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function exportMatchesCsv(){const csvrow=(cells)=>cells.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';');const rows=[csvrow(['Ronde','Duel','Speler 1','Speler 2','Status','Datum','Tijd','Winnaar','Score','Rondedeadline'])];for(const match of allMatches()){const s=data.schedule[match.id]||{};rows.push(csvrow([roundLabel(match.round,howManyRounds()),match.index+1,name(match.a),name(match.b),matchStatus(match),s.date||'',s.time||'',match.winner?name(match.winner):'',data.settings.resultText[match.id]||'',data.settings.roundDeadlines[match.round]||'']))}downloadFile('\uFEFF'+rows.join('\r\n'),'OHC-speelschema.csv','text/csv;charset=utf-8')}
async function importBackup(ev){const f=ev.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.players)||!Array.isArray(obj.draw)||typeof obj.results!=='object'||!obj.schedule||typeof obj.schedule!=='object')throw Error('Geen geldige OHC-back-up.');if(obj.players.some(p=>typeof p.id!=='string'||!/^[a-zA-Z0-9_-]{1,64}$/.test(p.id)||typeof p.name!=='string'||p.name.length>100||!Array.isArray(p.blocked)))throw Error('Ongeldige deelnemergegevens.');if(new Set(obj.players.map(p=>p.id)).size!==obj.players.length)throw Error('Dubbele deelnemers-ID.');if(obj.draw.length&&(obj.draw.length<2||(obj.draw.length&(obj.draw.length-1))!==0||obj.draw.some(x=>x!==null&&!obj.players.some(p=>p.id===x))))throw Error('Ongeldige toernooiloting.');if(!confirm('De huidige toernooigegevens vervangen door deze back-up?'))return;data={...structuredClone(DEFAULT),...obj,settings:{...structuredClone(DEFAULT.settings),...obj.settings,roundDeadlines:obj.settings?.roundDeadlines||{},resultText:obj.settings?.resultText||{}}};save();render();notify('Back-up hersteld.')}catch(e){notify('Herstellen mislukt: '+e.message)}}
async function exportBracketPng(){const rounds=bracket();if(!rounds.length){notify('Voer eerst de loting uit.');return}const width=Math.max(960,rounds.length*270+75),rowHeight=92,margin=46,colWidth=245;const height=Math.max(620,rounds[0].length*rowHeight+240);const canvas=document.createElement('canvas');const factor=Math.max(1,Math.min(2,3200/Math.max(width,height)));canvas.width=Math.round(width*factor);canvas.height=Math.round(height*factor);const ctx=canvas.getContext('2d');if(!ctx){notify('Afbeelding exporteren is niet beschikbaar.');return}ctx.scale(factor,factor);ctx.fillStyle='#07101e';ctx.fillRect(0,0,width,height);ctx.fillStyle='#ff8b3e';ctx.font='bold 15px Arial';ctx.fillText('OPTSCH  •  HEADS-UP CUP',margin,44);ctx.fillStyle='#f5f7fb';ctx.font='bold 32px Arial';ctx.fillText('TOERNOOIBOOM',margin,88);ctx.font='13px Arial';ctx.fillStyle='#a6b7cf';ctx.fillText(`${data.players.length} deelnemers  •  directe knock-out  •  ${rounds.length} rondes`,margin,116);const top=165;const clipName=(str,max)=>{let x=str;if(ctx.measureText(x).width<=max)return x;while(x.length>2&&ctx.measureText(x+'…').width>max)x=x.slice(0,-1);return x+'…'};rounds.forEach((matches,r)=>{const x=margin+r*270;ctx.fillStyle='#ffab68';ctx.font='bold 14px Arial';ctx.fillText(roundLabel(r,rounds.length).toUpperCase(),x,147);const spacing=(height-top-70)/matches.length;matches.forEach((m,i)=>{const y=top+(i+.5)*spacing-34;ctx.fillStyle='#16243b';ctx.fillRect(x,y,colWidth,71);ctx.strokeStyle='#39506f';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,colWidth-1,70);[m.a,m.b].forEach((pid,j)=>{const yy=y+20+j*29;if(pid&&pid===m.winner){ctx.fillStyle='#1b4b3c';ctx.fillRect(x+6,yy-15,colWidth-12,24)}ctx.fillStyle=pid&&pid===m.winner?'#9af7bf':'#eff4fd';ctx.font=pid&&pid===m.winner?'bold 13px Arial':'13px Arial';ctx.fillText(clipName(name(pid),colWidth-27),x+13,yy+1)});});});const c=champion();if(c){ctx.fillStyle='#ffb56f';ctx.font='bold 20px Arial';ctx.fillText('🏆 KAMPIOEN: '+name(c),margin,height-29)}else{ctx.fillStyle='#8da2bd';ctx.font='12px Arial';ctx.fillText('OPTSCH Heads-Up Cup • voorlopige toernooiboom',margin,height-29)}canvas.toBlob(blob=>{if(!blob){notify('PNG genereren mislukt.');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='OHC-toernooiboom.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)},'image/png')}
function render(){if(!['overzicht','deelnemers','schema','boom','reglement','beheer'].includes(tab))tab='overzicht';nav();if(loading){$('main').innerHTML='<div class="panel"><h2>OHC laden…</h2><p class="muted">Gegevens ophalen uit de Ranking-database.</p></div>';return}if(loadError){$('main').innerHTML='<div class="panel"><h2>Verbinding mislukt</h2><p class="muted">'+esc(loadError)+'</p><button class="btn" onclick="initialize()">Opnieuw proberen</button></div>';return}$('main').innerHTML=({overzicht:overview,deelnemers:playersView,schema:scheduleView,boom:bracketView,reglement:rulesView,beheer:adminView}[tab])()}
function selectEdit(id){editPlayer=id;render();$('personformtitle')?.scrollIntoView({behavior:'smooth',block:'center'})}
function changePlayers(){/* De deelnemerslijst wordt na loting niet ongemerkt gewijzigd. */}
function savePlayer(){const n=$('playerName')?.value.trim().replace(/\s+/g,' ');if(!n){notify('Vul eerst een naam in.');return}const blocked=[...document.querySelectorAll('.blockday:checked')].map(x=>Number(x.value));const duplicate=data.players.find(p=>p.name.toLocaleLowerCase('nl')===n.toLocaleLowerCase('nl')&&p.id!==editPlayer);if(duplicate){notify('Deze naam staat al op de deelnemerslijst.');return}if(editPlayer){const p=player(editPlayer);if(!p)return;p.name=n;p.blocked=blocked}else{if(data.draw.length){notify('Na de loting kunnen geen nieuwe spelers worden toegevoegd.');return}data.players.push({id:safeId(),name:n,blocked})}editPlayer=null;save();render();notify('Deelnemer opgeslagen. De loting is behouden.')}
function removePlayer(id){const p=player(id);if(!p)return;if(data.draw.length){notify('Wis de loting voordat je een ingelote deelnemer verwijdert.');return}if(!confirm(`Deelnemer ${p.name} verwijderen?`))return;data.players=data.players.filter(x=>x.id!==id);save();editPlayer=null;render();notify('Deelnemer verwijderd.')}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const j=bytes[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function createDraw(){
 if(data.players.length<2){notify('Voeg minimaal twee spelers toe.');return}
 if(data.players.length>32){notify('Het vastgestelde schema heeft vijf rondes en ondersteunt maximaal 32 deelnemers.');return}
 if(data.draw.length&&!confirm('Opnieuw loten? Alle uitslagen en wedstrijddatums worden opnieuw ingedeeld.'))return;
 const shuffled=shuffle(data.players.map(p=>p.id)),size=2**Math.ceil(Math.log2(shuffled.length));
 const pairs=size/2,slots=Array(size).fill(null),positions=shuffle([...Array(pairs)].map((_,i)=>i)),byes=size-shuffled.length;
 let k=0;for(let i=0;i<pairs;i++){const at=positions[i]*2;slots[at]=shuffled[k++]||null;if(i>=byes)slots[at+1]=shuffled[k++]||null}
 data.draw=slots;data.results={};data.schedule={};data.settings.resultText={};
 data.settings.status='Loting uitgevoerd';
 const assigned=autoPlanMatches(false);
 save();render();notify('Loting uitgevoerd. '+assigned.assigned+' duels over de vaste rondeperiodes verdeeld.'+(assigned.missing.length?' Controleer '+assigned.missing.length+' ontbrekende datums.':''));
}
function setWinner(r,i,w){
 const before=bracket(),m=before[r]?.[i];if(!m||!m.a||!m.b||(w&&![m.a,m.b].includes(w)))return;
 const key=matchKey(r,i),previous=m.winner;
 if(previous===w&&w){data.settings.resultText[key]=($('result_'+r+'_'+i)?.value||'').trim().slice(0,30);save();render();notify('Resultaatdetails bijgewerkt.');return}
 if(previous!==w&&previous&&w&&!confirm('Winnaar wijzigen? Afhankelijke resultaten worden gewist en de planning wordt opnieuw gecontroleerd.'))return;
 if(w){data.results[key]=w;data.settings.resultText[key]=($('result_'+r+'_'+i)?.value||'').trim().slice(0,30)}
 else{delete data.results[key];delete data.settings.resultText[key]}
 for(let round=r+1;round<before.length;round++){
  const afterRound=bracket()[round];
  for(let index=0;index<before[round].length;index++){
   const old=before[round][index],now=afterRound[index];
   if(old.a!==now.a||old.b!==now.b){
    delete data.results[old.id];
    delete data.settings.resultText[old.id];
    if(data.schedule[old.id])data.schedule[old.id].provisional=true;
   }
  }
 }
 if(champion())data.settings.status='Toernooi afgerond';
 else if(Object.keys(data.results).length)data.settings.status='Toernooi bezig';
 else data.settings.status='Loting uitgevoerd';
 const plan=autoPlanMatches(false);
 save();render();notify((w?'Winnaar doorgeschoven.':'Uitslag gewist.')+(plan.missing.length?' Er ontbreken '+plan.missing.length+' planbare duels.':' Planning gecontroleerd.'));
}
function pickDate(r,i,value){const input=$(`date_${r}_${i}`);if(input)input.value=value}
function saveMatchDate(r,i){
 const m=bracket()[r]?.[i];if(!m||!m.a||!m.b||m.isBye)return;
 const dt=$('date_'+r+'_'+i).value,tm=$('time_'+r+'_'+i).value;
 if(!dt){notify('Kies eerst een speeldatum.');return}
 const conflict=scheduleConflict(m,{date:dt,time:tm});
 if(conflict){notify('Niet toegestaan: '+conflict);return}
 data.schedule[m.id]={date:dt,time:tm,provisional:false,auto:false};
 autoPlanMatches(false);save();render();notify('Datum bevestigd en planning van vervolgrondes gecontroleerd.');
}
function clearDate(r,i){delete data.schedule[matchKey(r,i)];save();render();notify('Speeldatum verwijderd.')}
function updateStatus(v){data.settings.status=v;save();render()}
function parseCSV(text){let rows=[],row=[],cur='',quote=false;const input=text.replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){const c=input[i];if(quote){if(c==='"'&&input[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=false;else cur+=c}else if(c==='"')quote=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}if(quote)throw Error('CSV bevat een niet-afgesloten aanhalingsteken.');row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCsv(ev){const f=ev.target.files?.[0];if(!f)return;try{const rows=parseCSV(await f.text());const header=rows.shift()?.map(x=>x.trim().toLowerCase())||[];const nameCol=header.findIndex(x=>x==='naam'||x.startsWith('naam '));const canCol=header.findIndex(x=>x.includes('welke weekdagen')||x.includes('niet spelen'));const answerCol=header.findIndex(x=>x.includes('doe jij mee'));if(nameCol<0)throw Error('Kolom Naam ontbreekt in het CSV-bestand.');let added=0,updated=0,skipped=0;for(const row of rows){const n=(row[nameCol]||'').trim().replace(/\s+/g,' ');if(!n||(answerCol>=0&&!/^ja\b/i.test((row[answerCol]||'').trim()))){skipped++;continue}const blocked=canCol<0?[]:DAYS.filter(d=>(row[canCol]||'').toLocaleLowerCase('nl').includes(d.search)).map(d=>d.id);const old=data.players.find(p=>p.name.toLocaleLowerCase('nl')===n.toLocaleLowerCase('nl'));if(old){if(canCol>=0)old.blocked=blocked;updated++}else if(data.draw.length){skipped++}else{data.players.push({id:safeId(),name:n,blocked});added++}}save();render();notify(`${added} toegevoegd, ${updated} bijgewerkt, ${skipped} overgeslagen${data.draw.length?' (loting is actief)':''}.`)}catch(e){notify(`Import mislukt: ${e.message}`)}}
function exportJson(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='OHC-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function resetAll(){if(!isAdmin||!confirm('Loting, speeldata en uitslagen definitief wissen? De deelnemers blijven behouden.'))return;data.draw=[];data.results={};data.schedule={};data.settings.resultText={};data.settings.status='Inschrijving open';editPlayer=null;save();render();notify('Loting en uitslagen gewist. De vastgestelde speelperiodes blijven behouden.')}
addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==tab){tab=next;render()}});
initialize();
