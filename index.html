'use strict';
const STORAGE='ohc.online.v1';

const PROJECT_URL='https://lnlaqrljtwrxtfsyotnn.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_wXilWOoEC4fEBswRNtnWAw_MRQ0AooI';
let sb=null,authUser=null,isAdmin=false,eventId=null,currentVersion=1;
let publicState=null,loading=true,loadError=null,mutationToken=0,saveQueue=Promise.resolve();
async function fetchPublic(){
 const response=await sb.from('ohc_public_events').select('event_id,state').eq('slug','2026').single();
 if(response.error)throw new Error('Toernooidata ophalen: '+response.error.message);
 eventId=response.data.event_id;
 publicState=normalizeState(response.data.state);
 if(!isAdmin)data=structuredClone(publicState);
}
function normalizeState(v){
 return {...structuredClone(DEFAULT),...(v||{}),settings:{...structuredClone(DEFAULT.settings),...(v?.settings||{}),roundDeadlines:v?.settings?.roundDeadlines||{},resultText:v?.settings?.resultText||{}}};
}
async function fetchPrivate(){
 if(!authUser||!eventId){isAdmin=false;data=structuredClone(publicState);return}
 const response=await sb.from('ohc_events').select('id,state,version').eq('id',eventId).maybeSingle();
 if(response.error||!response.data){
   isAdmin=false;
   data=structuredClone(publicState);
   return;
 }
 isAdmin=true;
 currentVersion=Number(response.data.version);
 data=normalizeState(response.data.state);
}
async function initialize(){
 loading=true;loadError=null;render();
 try{
   if(!window.supabase?.createClient)throw new Error('De Supabase-client is niet geladen. Controleer de internetverbinding.');
   if(!sb)sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
   const {data:sessionData,error:sessionError}=await sb.auth.getSession();
   if(sessionError)throw sessionError;
   authUser=sessionData.session?.user||null;
   if(authUser){await fetchPublic();await fetchPrivate();}
   if(!window.ohcAuthListener){
     const {data:listener}=sb.auth.onAuthStateChange((event,session)=>{
       authUser=session?.user||null;
       if(event==='SIGNED_OUT'){isAdmin=false;eventId=null;publicState=null;data=structuredClone(DEFAULT);if(window.ohcRealtime){sb.removeChannel(window.ohcRealtime);window.ohcRealtime=null}tab='overzicht';render()}
       else if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED')setTimeout(async()=>{try{await fetchPublic();await fetchPrivate();loadError=null;render()}catch(e){loadError=String(e?.message||e);render()}},0);
     });
     window.ohcAuthListener=listener;
   }
   if(authUser&&!window.ohcRealtime){
     window.ohcRealtime=sb.channel('ohc-public-updates')
       .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ohc_public_events'},
         async payload=>{
           if(!authUser||payload.new?.event_id!==eventId)return;
           publicState=normalizeState(payload.new.state);
           if(!isAdmin){data=structuredClone(publicState);render()}
         }).subscribe();
   }
 }catch(e){loadError=String(e?.message||e)}
 loading=false;render();
}
async function login(){
 const email=$('loginEmail')?.value?.trim(),password=$('loginPassword')?.value;
 if(!email||!password){notify('Vul je e-mailadres en wachtwoord in.');return}
 const r=await sb.auth.signInWithPassword({email,password});
 if(r.error){notify('Inloggen mislukt: '+r.error.message);return}
 authUser=r.data.user;
 try{
  loading=true;render();
  await fetchPublic();
  await fetchPrivate();
  loadError=null;
  tab='overzicht';location.hash='overzicht';
  if(!window.ohcRealtime){
   window.ohcRealtime=sb.channel('ohc-public-updates')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ohc_public_events'},async payload=>{
     if(!authUser||payload.new?.event_id!==eventId)return;
     publicState=normalizeState(payload.new.state);
     if(!isAdmin){data=structuredClone(publicState);render();}
    }).subscribe();
  }
 }catch(e){loadError=String(e?.message||e)}
 finally{loading=false;render();}
 if(!loadError)notify('Je bent ingelogd.');
}
async function logout(){
 const r=await sb.auth.signOut();
 if(r.error){notify('Uitloggen mislukt: '+r.error.message);return}
 authUser=null;isAdmin=false;eventId=null;publicState=null;data=structuredClone(DEFAULT);if(window.ohcRealtime){sb.removeChannel(window.ohcRealtime);window.ohcRealtime=null;}tab='overzicht';location.hash='overzicht';render();
}

];
function ensureRoundSettings(){
 data.settings.roundDeadlines=Object.fromEntries(ROUND_WINDOWS.map((w,r)=>[r,w.end]));
 data.settings.roundWindows=ROUND_WINDOWS;
}
function roundDays(r){
 const w=ROUND_WINDOWS[r];if(!w)return[];
 const days=[];const date=new Date(w.start+'T12:00:00');
 while(toLocalISO(date)<=w.end){const day=toLocalISO(date);if(!w.exclusions.includes(day))days.push(day);date.setDate(date.getDate()+1)}

}

}

 // - 1st and 2nd: round DOWN to whole euros.
 // - 4th: round to the NEAREST half euro.

 // - 3rd: receives the EXACT remainder of the net prize pool.

    payouts.some(value=>value<0||value%PRIZE_ROUNDING_CENTS!==0))
  throw Error('Prijzen komen niet overeen met de netto prijzenpot.');

  remainingCents:netPrizeCents-4*eachFifth,payouts};

function drawBracketConnections(){
 const root=$('ohcBracket'),svg=$('ohcBracketLines');
 if(!root||!svg)return;
 const cols=[...root.querySelectorAll('.bracketcolumn')];
 if(cols.length<2)return;
 const rootRect=root.getBoundingClientRect(),paths=[];
 const center=(el)=>{
  const rect=el.getBoundingClientRect();
  return {left:rect.left-rootRect.left,right:rect.right-rootRect.left,y:(rect.top+rect.bottom)/2-rootRect.top};
 };
 for(let r=1;r<cols.length;r++){
  const previous=[...cols[r-1].querySelectorAll('.matchcard')];
  const current=[...cols[r].querySelectorAll('.matchcard')];
  for(let i=0;i<current.length;i++){
   const left=previous[i*2],right=previous[i*2+1];
   if(!left||!right)continue;
   const a=center(left),b=center(right),dest=center(current[i]);
   const branch=Math.round((a.right+dest.left)/2),middle=Math.round((a.y+b.y)/2);
   const v=x=>Math.round(x);
   paths.push('<path d="M'+v(a.right)+' '+v(a.y)+' H'+branch+
     ' M'+v(b.right)+' '+v(b.y)+' H'+branch+
     ' M'+branch+' '+v(a.y)+' V'+v(b.y)+
     ' M'+branch+' '+middle+' H'+v(dest.left)+'"/>');
  }
 }
 if(cols.length>1){
    const semis=[...cols[cols.length-2].querySelectorAll('.matchcard')];
    const bronze=[...cols[cols.length-1].querySelectorAll('.matchcard')][1];
    if(semis.length===2&&bronze){
      const dest=center(bronze),trunk=Math.round(dest.left-15);
      for(const semi of semis){
        const src=center(semi);
        paths.push('<path class="bronze-wire" d="M'+Math.round(src.right)+' '+Math.round(src.y)+
          ' H'+trunk+' V'+Math.round(dest.y)+' H'+Math.round(dest.left)+'"/>');
      }
    }
  }
  svg.setAttribute('width',String(root.scrollWidth));
 svg.setAttribute('height',String(root.scrollHeight));
 svg.setAttribute('viewBox','0 0 '+root.scrollWidth+' '+root.scrollHeight);
 svg.innerHTML=paths.join('');
}

function runAutoPlanning(){
 if(!isAdmin)return;
 const snapshot=structuredClone(data.schedule),result=autoPlanMatches(false);
 if(result.conflicts.length){
  data.schedule=snapshot;render();
  notify('Niet opgeslagen: een vastgestelde datum blokkeert de opeenvolging van volledige rondes. Pas die afspraak eerst in onderling overleg aan.');
  return;
 }
 save();render();
 notify(result.assigned+' duels ingedeeld.'+
  (result.missing.length?' '+result.missing.length+' vereisen handmatige planning.':'')+
  (result.agreementNeeded.length?' '+result.agreementNeeded.length+' vragen onderling overleg.':''));
}
function replanMatch(r,i){
 if(!isAdmin)return;
 const id=matchKey(r,i),old=data.schedule[id];
 if(old?.date&&old.provisional===false){
  notify('Deze speeldag is vastgesteld. Wijzig alleen na onderling akkoord via de datumvelden.');
  return;
 }
 const snapshot=structuredClone(data.schedule);
 delete data.schedule[id];
 const plan=autoPlanMatches(false);
 if(plan.conflicts.length){
  data.schedule=snapshot;render();notify('Niet herpland: de rondevolgorde zou conflicteren met een vastgestelde datum.');return;
 }
 save();render();notify('Voorstel opnieuw berekend binnen de rondeperiode.');
}

function exportMatchesCsv(){const csvrow=(cells)=>cells.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';');const rows=[csvrow(['Ronde','Duel','Speler 1','Speler 2','Status','Datum','Tijd','Onderling akkoord','Winnaar','Score','Rondedeadline'])];for(const match of allMatches()){const s=data.schedule[match.id]||{};rows.push(csvrow([roundLabel(match.round,howManyRounds()),match.isBronze?'Bronsfinale':match.round===howManyRounds()-1?'Finale':match.index+1,bracketSlotText(match.round,match.index,0,match.a),bracketSlotText(match.round,match.index,1,match.b),matchStatus(match),s.date||'',s.date?(s.time||DEFAULT_MATCH_TIME):'',matchHasAgreement(match,s)?'Ja':'Nee',match.winner?name(match.winner):'',data.settings.resultText[match.id]||'',data.settings.roundDeadlines[match.round]||'']))}downloadFile('\uFEFF'+rows.join('\r\n'),'OHC-speelschema.csv','text/csv;charset=utf-8')}
async function importBackup(ev){const f=ev.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.players)||!Array.isArray(obj.draw)||typeof obj.results!=='object'||!obj.schedule||typeof obj.schedule!=='object')throw Error('Geen geldige OHC-back-up.');if(obj.players.some(p=>typeof p.id!=='string'||!/^[a-zA-Z0-9_-]{1,64}$/.test(p.id)||typeof p.name!=='string'||p.name.length>100||!Array.isArray(p.blocked)))throw Error('Ongeldige deelnemergegevens.');if(obj.players.length>MAX_PLAYERS)throw Error('De OHC heeft maximaal 32 plaatsen.');if(new Set(obj.players.map(p=>p.id)).size!==obj.players.length)throw Error('Dubbele deelnemers-ID.');if(obj.draw.length&&(obj.draw.length<2||(obj.draw.length&(obj.draw.length-1))!==0||obj.draw.some(x=>x!==null&&!obj.players.some(p=>p.id===x))))throw Error('Ongeldige toernooiloting.');if(obj.draw.length){const valid=checkDrawCompatibility(obj.draw,obj.players);if(!valid.valid)throw Error('Deze back-up schendt de beschikbaarheidsregels: '+valid.message)}if(!confirm('De huidige toernooigegevens vervangen door deze back-up?'))return;data={...structuredClone(DEFAULT),...obj,settings:{...structuredClone(DEFAULT.settings),...obj.settings,roundDeadlines:obj.settings?.roundDeadlines||{},resultText:obj.settings?.resultText||{}}};autoPlanMatches(false);save();render();notify('Back-up hersteld.')}catch(e){notify('Herstellen mislukt: '+e.message)}}
async function exportBracketPng(){const rounds=bracket();if(!rounds.length){notify('Voer eerst de loting uit.');return}const width=Math.max(960,rounds.length*270+75),rowHeight=92,margin=46,colWidth=245;const height=Math.max(620,rounds[0].length*rowHeight+240);const canvas=document.createElement('canvas');const factor=Math.max(1,Math.min(2,3200/Math.max(width,height)));canvas.width=Math.round(width*factor);canvas.height=Math.round(height*factor);const ctx=canvas.getContext('2d');if(!ctx){notify('Afbeelding exporteren is niet beschikbaar.');return}ctx.scale(factor,factor);ctx.fillStyle='#07101e';ctx.fillRect(0,0,width,height);ctx.fillStyle='#ff8b3e';ctx.font='bold 15px Arial';ctx.fillText('OPTSCH  •  HEADS-UP CUP',margin,44);ctx.fillStyle='#f5f7fb';ctx.font='bold 32px Arial';ctx.fillText('TOERNOOIBOOM',margin,88);ctx.font='13px Arial';ctx.fillStyle='#a6b7cf';ctx.fillText(`${data.players.length} deelnemers  •  directe knock-out  •  ${rounds.length} rondes`,margin,116);const top=165;const clipName=(str,max)=>{let x=str;if(ctx.measureText(x).width<=max)return x;while(x.length>2&&ctx.measureText(x+'…').width>max)x=x.slice(0,-1);return x+'…'};rounds.forEach((matches,r)=>{const x=margin+r*270;ctx.fillStyle='#ffab68';ctx.font='bold 14px Arial';ctx.fillText(roundLabel(r,rounds.length).toUpperCase(),x,147);const spacing=(height-top-70)/matches.length;matches.forEach((m,i)=>{const y=top+(i+.5)*spacing-34;ctx.fillStyle='#16243b';ctx.fillRect(x,y,colWidth,71);if(m.isBronze){ctx.fillStyle='#ffad6b';ctx.font='bold 10px Arial';ctx.fillText('BRONSFINALE',x+5,y-7)}else if(r===rounds.length-1){ctx.fillStyle='#ffad6b';ctx.font='bold 10px Arial';ctx.fillText('FINALE',x+5,y-7)}ctx.strokeStyle='#39506f';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,colWidth-1,70);[m.a,m.b].forEach((pid,j)=>{const yy=y+20+j*29;if(pid&&pid===m.winner){ctx.fillStyle='#1b4b3c';ctx.fillRect(x+6,yy-15,colWidth-12,24)}ctx.fillStyle=pid&&pid===m.winner?'#9af7bf':'#eff4fd';ctx.font=pid&&pid===m.winner?'bold 13px Arial':'13px Arial';ctx.fillText(clipName(name(pid),colWidth-27),x+13,yy+1)});});});const c=champion();if(c){ctx.fillStyle='#ffb56f';ctx.font='bold 20px Arial';ctx.fillText('🏆 KAMPIOEN: '+name(c),margin,height-29)}else{ctx.fillStyle='#8da2bd';ctx.font='12px Arial';ctx.fillText('OPTSCH Heads-Up Cup • voorlopige toernooiboom',margin,height-29)}canvas.toBlob(blob=>{if(!blob){notify('PNG genereren mislukt.');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='OHC-toernooiboom.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)},'image/png')}

function swapMatchSignature(m){
 return [m?.a,m?.b].filter(Boolean).sort().join('|');
}
function swapDirectConflicts(slots){
 const result=[];
 const allowed=new Set(roundDays(0).map(d=>new Date(d+'T12:00:00').getDay()));
 for(let i=0;i<slots.length;i+=2){
  const a=slots[i],b=slots[i+1];
  if(!a||!b)continue;
  const common=DAYS.some(day=>allowed.has(day.id)&&
   preferredDayIds(a).includes(day.id)&&preferredDayIds(b).includes(day.id));
  if(!common)result.push({id:[a,b].sort().join('|'),index:i/2,a,b});
 }
 return result;
}
function swapPotentialConflicts(slots){
 const result=new Map();
 for(let i=0;i<slots.length;i++){
  if(!slots[i])continue;
  for(let j=i+1;j<slots.length;j++){
   if(!slots[j]||hasCommonPlayday(slots[i],slots[j]))continue;
   const id=[slots[i],slots[j]].sort().join('|');
   result.set(id,{round:Math.floor(Math.log2(i^j)),a:slots[i],b:slots[j]});
  }
 }
 return result;
}
function analyzeFirstRoundSwap(from,to){
 if(!isAdmin||!data.draw.length)return {error:'Er is geen loting om aan te passen.'};
 if(firstRoundIsComplete())return {error:'De eerste ronde is volledig afgerond. De loting is vergrendeld.'};
 const a=Number(from),b=Number(to),length=data.draw.length;
 if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>=length||b>=length||a===b)
  return {error:'Kies twee verschillende plaatsen in de eerste ronde.'};
 if(data.draw[a]===data.draw[b])return {error:'Deze twee plaatsen bevatten dezelfde waarde.'};
 const oldSlots=data.draw.slice(),newSlots=oldSlots.slice();
 [newSlots[a],newSlots[b]]=[newSlots[b],newSlots[a]];
 const structure=checkDrawCompatibility(newSlots);
 if(!structure.valid)return {error:structure.message};
 const oldMatches=bracket();
 const directOld=swapDirectConflicts(oldSlots),directNew=swapDirectConflicts(newSlots);
 const directSet=new Set(directOld.map(x=>x.id));
 const addedDirect=directNew.filter(x=>!directSet.has(x.id));
 const potentialOld=swapPotentialConflicts(oldSlots),potentialNew=swapPotentialConflicts(newSlots);
 const earlier=[...potentialNew].filter(([id,next])=>{
  const old=potentialOld.get(id);
  return old&&next.round<old.round;
 }).map(([,entry])=>entry);
 const olderState=data;
 const changedFixtures=[],erasedResults=[],erasedDates=[],erasedConfirmations=[];
 let plan=null,projected=null,unsafeConfirmed=[];
 try{
  data=structuredClone(olderState);
  data.draw=newSlots;
  // Move from the earliest round outward, so participants in later rounds
  // are recalculated AFTER invalid results have been removed.
  for(let round=0;round<oldMatches.length;round++){
   const oldRound=oldMatches[round]||[];
   for(const previous of oldRound){
    const now=bracket()[round]?.[previous.index];
    if(!now)continue;
    if(swapMatchSignature(previous)!==swapMatchSignature(now)){
     changedFixtures.push(previous.id);
     if(data.results[previous.id]){
      erasedResults.push(previous.id);
      delete data.results[previous.id];
     }
     if(data.settings.resultText[previous.id])delete data.settings.resultText[previous.id];
     if(data.schedule[previous.id]?.date){
      erasedDates.push(previous.id);
      if(data.schedule[previous.id].provisional===false)
       erasedConfirmations.push(previous.id);
      delete data.schedule[previous.id];
     }
    }else if(previous.a!==now.a||previous.b!==now.b){
     // Same two opponents, merely reversing paper home/away:
     // retain a played result and existing dates/agreements.
     const schedule=data.schedule[previous.id];
     if(schedule?.mutualAgreement===true&&now.a&&now.b)
      schedule.agreedPlayers=[now.a,now.b];
    }
   }
  }
  plan=autoPlanMatches(false);
  // A previously confirmed FUTURE match can be based on the old set
  // of possible participants. Flag that loss of universal availability.
  const rounds=bracket(),memo=new Map();
  for(const matches of rounds)for(const m of matches){
   const scheduled=data.schedule[m.id];
   if(!scheduled?.date||scheduled.provisional!==false||m.isBye||m.round===0)continue;
   const possibles=possibleFixturePlayers(m,rounds,memo);
   const evaluation=fixtureAvailability(m,scheduled.date,possibles);
   if(!evaluation.universal&&!matchHasAgreement(m,scheduled)&&!(m.resolved&&m.winner))
    unsafeConfirmed.push(m.id);
  }
  data.settings.status=Object.keys(data.results).length?'Toernooi bezig':'Loting uitgevoerd';
  if(tournamentComplete())data.settings.status='Toernooi afgerond';
  projected=structuredClone(data);
 }finally{
  data=olderState;
 }
 const modifications=oldMatches[0].map((m,i)=>{
  const oldSig=swapMatchSignature(m);
  const nextA=newSlots[i*2],nextB=newSlots[i*2+1];
  const newSig=[nextA,nextB].filter(Boolean).sort().join('|');
  const different=(oldSlots[i*2]!==nextA||oldSlots[i*2+1]!==nextB);
  return different?{index:i,oldA:oldSlots[i*2],oldB:oldSlots[i*2+1],newA:nextA,newB:nextB,opponentChange:oldSig!==newSig}:null;
 }).filter(Boolean);
 return {
  from:a,to:b,draw:newSlots,state:projected,modifications,
  directOld,directNew,addedDirect,earlier,
  erasedResults,erasedDates,erasedConfirmations,unsafeConfirmed,
  plan,blocked:!!plan?.conflicts?.length,
  changeCount:changedFixtures.length
 };
}
function swapPairText(a,b){
 return esc(a?name(a,true):'Vrijloting')+' <span class="vs">VS</span> '+
  esc(b?name(b,true):'Vrijloting');
}

 let preview;
 try{preview=analyzeFirstRoundSwap(from,to)}
 catch(e){target.innerHTML='<div class="notice orange">De wisseling kon niet worden gecontroleerd: '+esc(e.message)+'</div>';return}

 if(preview.erasedDates.length)
  message+='<div class="notice orange"><strong>Planning verandert:</strong> '+preview.erasedDates.length+
   ' bestaande speeldatum(s) worden opnieuw berekend, waarvan '+
   preview.erasedConfirmations.length+' eerder definitief vastgesteld.'+
   ' Informeer betrokken spelers en leg gewijzigde afspraken opnieuw vast.</div>';
 if(preview.unsafeConfirmed.length)
  message+='<div class="notice orange"><strong>Controleren:</strong> '+
   preview.unsafeConfirmed.length+
   ' bevestigde speeldatum(s) in een latere ronde zijn mogelijk niet meer geschikt voor alle nieuwe potentiële tegenstanders.</div>';
 if(preview.plan?.agreementNeeded?.length||preview.plan?.missing?.length)
  message+='<p class="muted smalltext">Na herberekening: '+preview.plan.agreementNeeded.length+
   ' duel(s) vragen onderling overleg en '+preview.plan.missing.length+
   ' duel(s) hebben nog geen passende speeldatum.</p>';
 if(preview.blocked){
  message+='<div class="notice orange"><strong>Wisselen nog niet mogelijk:</strong> de herberekende planning botst met vastgestelde speeldagen of de rondevolgorde. Pas die afspraken eerst aan.<ul>'+
   preview.plan.conflicts.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
 }else{
  message+='<div class="btnbar" style="margin-top:14px"><button type="button" class="btn" onclick="applyFirstRoundSwap()">Deze wisseling bevestigen</button></div>';
 }
 target.innerHTML=message+'</div>';
}
async function applyFirstRoundSwap(){
 const from=$('swapFrom')?.value,to=$('swapTo')?.value;
 let preview;
 try{preview=analyzeFirstRoundSwap(from,to)}
 catch(e){notify('Wisselen mislukt: '+e.message);return}
 if(preview.error||preview.blocked){notify(preview.error||'De planning blokkeert deze wisseling.');return}
 const extra=preview.directNew.length-preview.directOld.length;
 const clauses=[
  'De volgende twee eerste-rondeplaatsen verwisselen?',
  esc(name(data.draw[preview.from],true))+' ↔ '+esc(name(data.draw[preview.to],true)),
  'Conflicten zonder gezamenlijke speeldag in ronde 1: '+preview.directOld.length+' → '+preview.directNew.length+
   (extra>0?' (+'+extra+' EXTRA)':''),
  'Lastige potentiële ontmoetingen die eerder kunnen plaatsvinden: '+preview.earlier.length,
  'Uitslagen die vervallen: '+preview.erasedResults.length,
  'Bestaande speeldata die opnieuw worden berekend: '+preview.erasedDates.length+
    ' (waarvan '+preview.erasedConfirmations.length+' definitief).'
 ];
 if(!confirm(clauses.join('\n')+'\n\nDeze wijziging wordt zichtbaar voor alle ingelogde spelers. Doorgaan?'))return;
 // State version is checked by the existing optimistic-locking RPC.
 data=preview.state;
 const saved=await save();
 render();
 if(saved)notify('De eerste-ronde-indeling is gewijzigd; planning en vervolgrondes zijn gecontroleerd.');
}

function firstUnplayedRound(){
 const r=bracket();
 const i=r.findIndex(matches=>matches.some(m=>!m.resolved&&!m.isBye));
 return i>=0?i:Math.max(0,r.length-1);
}
function withRoundFilter(html,key){
 let count=0;
 const defaultRound=firstUnplayedRound();
 const selected=roundSelections[key]===undefined?defaultRound:roundSelections[key];
 const processed=html.replace(/<div class="roundgroup">/g,function(){
  const i=count++;
  return '<div class="roundgroup'+(selected!==-1&&selected!==i?' hidden':'')+'" data-round-group="'+i+'">';
 });
 if(count<2)return processed;
 let controls='<div class="round-filter-bar" aria-label="Filter op ronde"><span class="round-filter-label">TOON RONDE</span>';
 const btns=[[-1,'Alle'],...Array.from({length:count},(_,i)=>[i,'Ronde '+(i+1)])];
 controls+=btns.map(v=>'<button type="button" class="round-filter-btn'+(selected===v[0]?' active':'')+
  '" data-filter-key="'+key+'" data-filter-value="'+v[0]+'" aria-pressed="'+(selected===v[0])+'" onclick="setRoundSelection(this.dataset.filterKey,Number(this.dataset.filterValue))">'+v[1]+'</button>').join('');
 controls+='</div>';
 const pos=processed.indexOf('<div class="roundgroup');
 return processed.slice(0,pos)+controls+processed.slice(pos);
}
function setRoundSelection(key,value){
 roundSelections[key]=value;
 document.querySelectorAll('[data-round-group]').forEach(function(el){
  el.classList.toggle('hidden',value!==-1&&Number(el.dataset.roundGroup)!==value);
 });
 document.querySelectorAll('.round-filter-btn').forEach(function(el){
  const active=Number(el.dataset.filterValue)===value;
  el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
 });
}
function filterParticipants(value){
 const query=String(value||'').trim().toLocaleLowerCase('nl');
 let found=0;
 document.querySelectorAll('[data-player-name]').forEach(function(tr){
  const visible=tr.dataset.playerName.includes(query);
  tr.classList.toggle('hidden',!visible);
  if(visible)found++;
 });
 const empty=$('noPlayerMatches');
 if(empty)empty.classList.toggle('hidden',found!==0);
}

function savePlayer(){
 const n=$('playerName')?.value.trim().replace(/\s+/g,' ');
 if(!n){notify('Vul eerst een naam in.');return}
 const blocked=[...document.querySelectorAll('.blockday:checked')].map(x=>Number(x.value));
 if(blocked.length===7){notify('Een speler moet minimaal één beschikbare speeldag hebben.');return}
 const duplicate=data.players.find(p=>p.name.toLocaleLowerCase('nl')===n.toLocaleLowerCase('nl')&&p.id!==editPlayer);
 if(duplicate){notify('Deze naam staat al op de deelnemerslijst.');return}
 if(editPlayer){
  const p=player(editPlayer);if(!p)return;
  if(data.draw.length){
   const revised=data.players.map(x=>x.id===editPlayer?{...x,name:n,blocked}:x);
   const valid=checkDrawCompatibility(data.draw,revised);
   if(!valid.valid){notify('Niet opgeslagen: '+valid.message);return}
  }
  p.name=n;p.blocked=blocked;
 }else{
  if(registrationClosed()){notify('Inschrijven is gesloten sinds 21 november 2026.');return}
  if(data.draw.length){notify('Na de loting kunnen geen nieuwe spelers worden toegevoegd.');return}
  if(data.players.length>=MAX_PLAYERS){notify('De OHC heeft maximaal 32 plaatsen.');return}
  data.players.push({id:safeId(),name:n,blocked});
 }
 if(data.draw.length)autoPlanMatches(false);
 editPlayer=null;save();render();notify('Deelnemer opgeslagen; de bracket blijft geldig.');
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const j=bytes[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function hasCommonPlayday(a,b){
 if(!a||!b)return false;
 return DAYS.some(day=>!(a.blocked||[]).includes(day.id)&&!(b.blocked||[]).includes(day.id));
}
function checkDrawCompatibility(slots,players=data.players){
 if(!slots.length)return {valid:true};
 if(slots.length<2||slots.length>32||(slots.length&(slots.length-1))!==0)
  return {valid:false,message:'Ongeldige bracketgrootte.'};
 const ids=new Set(players.map(p=>p.id)),used=new Set();
 if(ids.size!==players.length)return {valid:false,message:'De deelnemerslijst bevat dubbele ID’s.'};
 for(const id of slots){
  if(id===null)continue;
  if(!ids.has(id)||used.has(id))return {valid:false,message:'De bracket bevat een onbekende of dubbele speler.'};
  used.add(id);
 }
 if(used.size!==players.length)return {valid:false,message:'Niet alle spelers staan in de bracket.'};
 for(let i=0;i<slots.length;i+=2)
  if(!slots[i]&&!slots[i+1])
   return {valid:false,message:'Er is een volledig leeg duel in de eerste ronde.'};
 return {valid:true};
}
function perfectCompatibleDraw(players=data.players){
 const roster=shuffle(players),n=roster.length;
 if(n<2)return {error:'Minimaal twee deelnemers nodig.'};
 if(n>32)return {error:'De vijf vaste rondes ondersteunen maximaal 32 spelers.'};
 const size=2**Math.ceil(Math.log2(n)),half=size/2;
 const adjacency=Array.from({length:n},()=>[]);let conflicts=0;
 for(let i=0;i<n;i++){
  if(!DAYS.some(day=>!(roster[i].blocked||[]).includes(day.id)))
   return {error:roster[i].name+' heeft op geen enkele weekdag beschikbaarheid.'};
  for(let j=i+1;j<n;j++)if(!hasCommonPlayday(roster[i],roster[j])){
   adjacency[i].push(j);adjacency[j].push(i);conflicts++;
  }
 }
 // All potential meetings before the final take place in the SAME bracket half.
 // Every pair without a common playing day must therefore be in OPPOSITE halves.
 const colors=Array(n).fill(-1),components=[];
 for(let i=0;i<n;i++){
  if(colors[i]!==-1)continue;
  const groups=[[],[]],queue=[i];colors[i]=0;
  for(let k=0;k<queue.length;k++){
   const current=queue[k];groups[colors[current]].push(roster[current]);
   for(const neighbor of adjacency[current]){
    if(colors[neighbor]===colors[current])
     return {error:'Geen geldige loting mogelijk: de verhinderingen vormen een onverenigbare groep die niet over twee brackethelften kan worden verdeeld. Pas beschikbaarheid aan of overleg over extra speeldagen.'};
    if(colors[neighbor]===-1){colors[neighbor]=1-colors[current];queue.push(neighbor)}
   }
  }
  components.push(groups);
 }
 if(size===2){
  const slots=roster.map(p=>p.id);
  return {slots,conflicts,byes:0};
 }
 // A bracket half must have enough players to give every round-one pairing
 // at least one participant (otherwise empty branches cause fake byes).
 const min=Math.max(Math.ceil(half/2),n-half),max=Math.min(half,n-Math.ceil(half/2));
 const targets=shuffle(Array.from({length:Math.max(0,max-min+1)},(_,i)=>min+i))
  .sort((a,b)=>Math.abs(a-n/2)-Math.abs(b-n/2));
 const ordered=shuffle(components);let split=null;
 for(const target of targets){
  const memo=new Map();
  function feasible(k,count){
   if(count>target)return false;
   if(k===ordered.length)return count===target;
   const key=k+':'+count;if(memo.has(key))return memo.get(key);
   const component=ordered[k];
   const ok=feasible(k+1,count+component[0].length)||feasible(k+1,count+component[1].length);
   memo.set(key,ok);return ok;
  }
  if(!feasible(0,0))continue;
  let count=0;const sides=[[],[]];
  for(let k=0;k<ordered.length;k++){
   const component=ordered[k];
   const orientation=shuffle([0,1]).find(side=>feasible(k+1,count+component[side].length));
   if(orientation===undefined)throw Error('Interne fout in de bracketindeling.');
   sides[0].push(...component[orientation]);
   sides[1].push(...component[1-orientation]);
   count+=component[orientation].length;
  }
  split=sides;break;
 }
 if(!split)return {
  error:'Geen geldige loting mogelijk: beide brackethelften moeten passen en alle vrijloten moeten speelbaar zijn. De verhinderingen laten dit niet toe. Pas de beschikbaarheden aan of maak aanvullende speelafspraken.'
 };
 const slots=Array(size).fill(null),pairs=half/2;
 for(let side=0;side<2;side++){
  const members=shuffle(split[side]),positions=shuffle(Array.from({length:pairs},(_,i)=>i));
  let cursor=0,byes=half-members.length;
  for(let i=0;i<pairs;i++){
   const index=side*half+positions[i]*2;
   slots[index]=members[cursor++].id;
   if(i>=byes)slots[index+1]=members[cursor++].id;
  }
  if(cursor!==members.length)throw Error('Interne fout bij het verdelen van vrijloten.');
 }
 const validation=checkDrawCompatibility(slots,players);
 if(!validation.valid)throw Error('De loting is afgekeurd: '+validation.message);
 return {slots,conflicts,byes:size-n};
}

function compatibleDraw(players=data.players){
 const n=players.length;
 if(n<2)return {error:'Minimaal twee deelnemers nodig.'};
 if(n>MAX_PLAYERS)return {error:'Maximaal 32 deelnemers toegestaan.'};
 for(const p of players)
  if(!DAYS.some(d=>!(p.blocked||[]).includes(d.id)))
   return {error:p.name+' heeft geen enkele beschikbare weekdag opgegeven.'};
 // An exact separation is optimal: every incompatible pair is on opposite
 // sides and therefore cannot meet before the final or bronze final.
 const perfect=perfectCompatibleDraw(players);
 if(!perfect.error)return {...perfect,optimal:true};
 // When exact separation cannot work, prefer the latest possible encounters.
 // Lexicographic penalties (base 1000 > max 496 player pairs) make a
 // first-round conflict always cost more than ALL later-round conflicts.
 const roster=shuffle(players),size=2**Math.ceil(Math.log2(n)),rounds=Math.log2(size);
 const incompatible=Array.from({length:n},()=>Array(n).fill(false)),edges=[];
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)
  if(!hasCommonPlayday(roster[i],roster[j])){
   incompatible[i][j]=incompatible[j][i]=true;edges.push([i,j]);
  }
 const costAt=Array.from({length:size},(_,i)=>
  Array.from({length:size},(_,j)=>i===j?0:
   1000**(rounds-1-(31-Math.clz32(i^j)))));
 const pairs=size/2;
 function randomizedSlots(){
  const shuffled=shuffle(Array.from({length:n},(_,i)=>i));
  const matchOrder=shuffle(Array.from({length:pairs},(_,i)=>i));
  const secondOrder=shuffle(matchOrder),slots=Array(size).fill(null);
  for(let k=0;k<pairs;k++)slots[2*matchOrder[k]]=shuffled[k];
  for(let k=pairs;k<n;k++)slots[2*secondOrder[k-pairs]+1]=shuffled[k];
  for(let i=0;i<size;i+=2)
   if(Math.random()<0.5)[slots[i],slots[i+1]]=[slots[i+1],slots[i]];
  return slots;
 }
 function totalCost(slots){
  let total=0;
  for(let i=0;i<size;i++){
   if(slots[i]===null)continue;
   for(let j=i+1;j<size;j++)
    if(slots[j]!==null&&incompatible[slots[i]][slots[j]])
     total+=costAt[i][j];
  }
  return total;
 }
 function validSwap(slots,i,j){
  if(slots[i]===slots[j])return false;
  if(slots[i]===null&&slots[j^1]===null)return false;
  if(slots[j]===null&&slots[i^1]===null)return false;
  return true;
 }
 function delta(slots,i,j){
  const a=slots[i],b=slots[j];let value=0;
  for(let k=0;k<size;k++){
   if(k===i||k===j||slots[k]===null)continue;
   const other=slots[k];
   if(a!==null&&incompatible[a][other])
    value+=costAt[j][k]-costAt[i][k];
   if(b!==null&&incompatible[b][other])
    value+=costAt[i][k]-costAt[j][k];
  }
  return value;
 }
 let best=null,bestCost=Infinity;
 for(let start=0;start<18;start++){
  const current=randomizedSlots();let score=totalCost(current);
  for(let pass=0;pass<48;pass++){
   let improvement=0,bi=-1,bj=-1;
   for(let i=0;i<size;i++)for(let j=i+1;j<size;j++){
    if(!validSwap(current,i,j))continue;
    const change=delta(current,i,j);
    if(change<improvement||(change===improvement&&change<0&&Math.random()<0.22)){
     improvement=change;bi=i;bj=j;
    }
   }
   if(bi<0)break;
   [current[bi],current[bj]]=[current[bj],current[bi]];
   score+=improvement;
  }
  if(score<bestCost||(score===bestCost&&Math.random()<0.5)){
   bestCost=score;best=current.slice();
  }
 }
 const slots=best.map(i=>i===null?null:roster[i].id);
 const checked=checkDrawCompatibility(slots,players);
 if(!checked.valid)throw Error(checked.message);
 const encounterCounts=Array(rounds).fill(0);
 for(const [i,j] of edges){
  const a=best.indexOf(i),b=best.indexOf(j);
  encounterCounts[31-Math.clz32(a^b)]++;
 }
 return {slots,conflicts:edges.length,byes:size-n,optimal:false,
   encounterCounts,score:bestCost};
}
function createDraw(){
 if(!isAdmin){notify('Alleen beheerders kunnen loten.');return}
 if(data.draw.length){notify('De bracket is al geloot: alle routes staan vast. Voor een volledige herstart moet de beheerder eerst de loting wissen.');return}
 const result=compatibleDraw(data.players);
 if(result.error){notify(result.error);return}
 data.draw=result.slots;data.results={};data.schedule={};data.settings.resultText={};
 data.settings.status='Loting uitgevoerd';
 const planned=autoPlanMatches(false);
 save();render();
 notify('Loting uitgevoerd: '+result.conflicts+' mogelijke combinaties zonder gezamenlijke speeldag zo laat mogelijk geplaatst, '+
 result.byes+' vrijloten en '+planned.assigned+' voorgestelde speeldagen.'+
 (planned.missing.length?' Voor '+planned.missing.length+' duels is een onderlinge afspraak nodig.':''));
}
function setWinner(r,i,w){
 const before=bracket(),m=before[r]?.[i];if(!m||!m.a||!m.b||(w&&![m.a,m.b].includes(w)))return;
 const key=matchKey(r,i),previous=m.winner;
 if(previous===w&&w){data.settings.resultText[key]=($('result_'+r+'_'+i)?.value||'').trim().slice(0,30);save();render();notify('Resultaatdetails bijgewerkt.');return}
 if(previous!==w&&previous&&w&&!confirm('Winnaar wijzigen? Afhankelijke resultaten worden gewist en de planning wordt opnieuw gecontroleerd.'))return;
 if(w){data.results[key]=w;data.settings.resultText[key]=($('result_'+r+'_'+i)?.value||'').trim().slice(0,30)}
 else{delete data.results[key];delete data.settings.resultText[key]}
 for(let round=r+1;round<before.length;round++){
  const afterRound=bracket()[round];
  for(let index=0;index<before[round].length;index++){
   const old=before[round][index],now=afterRound[index];
   if(old.a!==now.a||old.b!==now.b){
    delete data.results[old.id];
    delete data.settings.resultText[old.id];
    if(data.schedule[old.id]){
     // A replacement opponent has not agreed to the former arrangement.
     data.schedule[old.id].provisional=true;
     data.schedule[old.id].auto=true;
     data.schedule[old.id].time=DEFAULT_MATCH_TIME;
     delete data.schedule[old.id].mutualAgreement;
     delete data.schedule[old.id].agreedPlayers;
    }
   }
  }
 }
 if(tournamentComplete())data.settings.status='Toernooi afgerond';
 else if(Object.keys(data.results).length)data.settings.status='Toernooi bezig';
 else data.settings.status='Loting uitgevoerd';
 const plan=autoPlanMatches(false);
 save();render();notify((w?'Winnaar doorgeschoven.':'Uitslag gewist.')+(plan.missing.length?' Er ontbreken '+plan.missing.length+' planbare duels.':' Planning gecontroleerd.'));
}
function pickDate(r,i,value){const input=$(`date_${r}_${i}`);if(input)input.value=value}
function saveMatchDate(r,i){
 if(!isAdmin)return;
 const m=bracket()[r]?.[i];if(!m||!m.a||!m.b||m.isBye)return;
 const dt=$('date_'+r+'_'+i)?.value;
 const tm=$('time_'+r+'_'+i)?.value||DEFAULT_MATCH_TIME;
 if(!dt){notify('Kies eerst de speeldag.');return}
 const previous=data.schedule[m.id]||{};
 const agreed=$('agreed_'+r+'_'+i)?.checked===true;
 const moved=!!previous.date&&previous.date!==dt;
 const changedTime=tm!==(previous.time||DEFAULT_MATCH_TIME);
 const outsideAvailability=!availableOnDate(m,dt);
 // First confirming the assigned day at 20:00 does not need an extra agreement.
 // Changing either day OR time does. If no automatic proposal exists, the
 // manually selected day also needs an explicit mutual agreement.
 const manuallyChosenDay=!previous.date;
 if((moved||changedTime||outsideAvailability||manuallyChosenDay)&&!agreed){
  notify('Een andere speeldag of starttijd is alleen toegestaan als beide spelers akkoord zijn. Vink Onderling akkoord aan.');
  return;
 }
 const mutualAgreement=agreed||(previous.date===dt&&!changedTime&&matchHasAgreement(m,previous));
 const proposed={date:dt,time:tm,provisional:false,auto:false,
  ...(mutualAgreement?{mutualAgreement:true,agreedPlayers:[m.a,m.b]}:{})};
 const err=scheduleConflict(m,proposed);
 if(err){notify('Speeldag niet toegestaan: '+err);return}
 const snapshot=structuredClone(data.schedule);
 data.schedule[m.id]=proposed;
 const plan=autoPlanMatches(false);
 if(plan.conflicts.length){
  data.schedule=snapshot;render();
  notify('Speeldag niet toegestaan: een volgende ronde zou beginnen terwijl de voorgaande ronde nog loopt.');
  return;
 }
 save();render();
 notify('Speeldag vastgelegd'+(mutualAgreement?' in onderling overleg':'')+' · '+tm+' uur.'+
  (plan.missing.length?' Controleer '+plan.missing.length+' duels waarvoor een planning of afspraak moet worden herzien.':''));
}
function clearDate(r,i){delete data.schedule[matchKey(r,i)];save();render();notify('Speeldatum verwijderd.')}
function updateStatus(v){data.settings.status=v;save();render()}
function parseCSV(text){let rows=[],row=[],cur='',quote=false;const input=text.replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){const c=input[i];if(quote){if(c==='"'&&input[i+1]==='"'){cur+='"';i++}else if(c==='"')quote=false;else cur+=c}else if(c==='"')quote=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=c}if(quote)throw Error('CSV bevat een niet-afgesloten aanhalingsteken.');row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function importCsv(ev){const f=ev.target.files?.[0];if(!f)return;try{const rows=parseCSV(await f.text());const header=rows.shift()?.map(x=>x.trim().toLowerCase())||[];const nameCol=header.findIndex(x=>x==='naam'||x.startsWith('naam '));const canCol=header.findIndex(x=>x.includes('welke weekdagen')||x.includes('niet spelen'));const answerCol=header.findIndex(x=>x.includes('doe jij mee'));if(nameCol<0)throw Error('Kolom Naam ontbreekt in het CSV-bestand.');let added=0,updated=0,skipped=0;const previousPlayers=structuredClone(data.players);for(const row of rows){const n=(row[nameCol]||'').trim().replace(/\s+/g,' ');if(!n||(answerCol>=0&&!/^ja\b/i.test((row[answerCol]||'').trim()))){skipped++;continue}const blocked=canCol<0?[]:DAYS.filter(d=>(row[canCol]||'').toLocaleLowerCase('nl').includes(d.search)).map(d=>d.id);const old=data.players.find(p=>p.name.toLocaleLowerCase('nl')===n.toLocaleLowerCase('nl'));if(old){if(canCol>=0)old.blocked=blocked;updated++}else if(data.draw.length){skipped++}else{data.players.push({id:safeId(),name:n,blocked});added++}}if(data.players.length>MAX_PLAYERS){data.players=previousPlayers;notify('CSV bevat meer dan 32 deelnemers. De beheerder moet eerst het definitieve deelnemersveld bepalen.');return}const checked=checkDrawCompatibility(data.draw,data.players);if(!checked.valid){data.players=previousPlayers;notify('CSV niet opgeslagen: '+checked.message);return}if(data.draw.length)autoPlanMatches(false);save();render();notify(`${added} toegevoegd, ${updated} bijgewerkt, ${skipped} overgeslagen${data.draw.length?' (loting is actief)':''}.`)}catch(e){notify(`Import mislukt: ${e.message}`)}}
function exportJson(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='OHC-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
